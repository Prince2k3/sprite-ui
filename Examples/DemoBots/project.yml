name: DemoBots
options:
  bundleIdPrefix: dev.spriteui
  postGenCommand: python3 Tools/configure-game-center-schemes.py
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  SpriteUI:
    path: ../..
targets:
  DemoBots:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [DemoBotsLocal.gamekit]
      - path: App/DemoBotsLocal.gamekit
        type: file
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
    dependencies:
      - package: SpriteUI
        product: DemoBotsGame
      - sdk: GameController.framework
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        DEVELOPMENT_TEAM: SHC9383T46
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: dev.spriteui.demobots
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/DemoBots-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: DemoBotsLocal.gamekit
  DemoBotsMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [DemoBotsLocal.gamekit]
      - path: App/DemoBotsLocal.gamekit
        type: file
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
    dependencies:
      - package: SpriteUI
        product: DemoBotsGame
      - sdk: GameController.framework
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        DEVELOPMENT_TEAM: SHC9383T46
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.spriteui.demobots.mac
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: App/DemoBots-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: DemoBotsLocal.gamekit

schemes:
  DemoBots:
    build:
      targets:
        DemoBots: all
    run:
      config: Debug
  DemoBotsMac:
    build:
      targets:
        DemoBotsMac: all
    run:
      config: Debug
  DemoBots Local Game Center:
    build:
      targets:
        DemoBots: all
    run:
      config: Debug
      environmentVariables:
        DEMOBOTS_GAME_CENTER_TESTING: "1"
  DemoBotsMac Local Game Center:
    build:
      targets:
        DemoBotsMac: all
    run:
      config: Debug
      environmentVariables:
        DEMOBOTS_GAME_CENTER_TESTING: "1"

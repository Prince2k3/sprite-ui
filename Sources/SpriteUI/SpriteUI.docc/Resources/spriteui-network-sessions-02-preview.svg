<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
<title id="title">Stage 2 · repair a lost pose</title>
<desc id="desc">Schematic result while all small unreliable states drop</desc>
<rect width="1040" height="480" rx="24" fill="#101b2c"/>
<text x="44" y="64" fill="#f3f7ff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Stage 2 · repair a lost pose</text>
<text x="44" y="101" fill="#b8cadf" font-family="system-ui,sans-serif" font-size="18">Schematic result while all small unreliable states drop</text>
<rect x="44" y="145" width="440" height="220" rx="18" fill="#192b42" stroke="#ffb663" stroke-width="2"/>
<text x="68" y="188" fill="#ffb663" font-family="system-ui,sans-serif" font-size="23" font-weight="600">Host · x = 20</text>
<text x="68" y="230" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18">Valid client command accepted</text>
<text x="68" y="264" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18">Invalid +900 command rejected</text>
<text x="68" y="298" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18">New coordinates sent as full state</text>
<rect x="556" y="145" width="440" height="220" rx="18" fill="#192b42" stroke="#63d7f5" stroke-width="2"/>
<text x="580" y="188" fill="#63d7f5" font-family="system-ui,sans-serif" font-size="23" font-weight="600">Client · x = 10</text>
<text x="580" y="230" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18">Small pose frame was dropped</text>
<text x="580" y="264" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18">Turn loss off and Pump</text>
<text x="580" y="298" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18">Next full state repairs x to 20</text>
<text x="44" y="420" fill="#b8cadf" font-family="system-ui,sans-serif" font-size="18">Reliable commands and baselines do not drop · Larger states stay reliable</text>
</svg>

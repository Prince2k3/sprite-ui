<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
<title id="title">Two cameras share a world</title><desc id="desc">Two panes center on cyan and orange players at different world positions in one shared scene.</desc>
<rect width="800" height="720" rx="24" fill="#101b2b"/>
<g font-family="system-ui,sans-serif" fill="#edf5ff"><text x="28" y="38" font-size="27" fill="#edf5ff" text-anchor="start">1. One world, two cameras</text><text x="28" y="82" font-size="18" fill="#a4bad0" text-anchor="start">Camera IDs belong to retained entities</text><rect x="28" y="108" width="744" height="360" rx="8" fill="#142438" stroke="#4b637e" stroke-width="2"/><path d="M76 110v356" stroke="#294056"/><path d="M124 110v356" stroke="#294056"/><path d="M172 110v356" stroke="#294056"/><path d="M220 110v356" stroke="#294056"/><path d="M268 110v356" stroke="#294056"/><path d="M316 110v356" stroke="#294056"/><path d="M364 110v356" stroke="#294056"/><path d="M412 110v356" stroke="#294056"/><path d="M460 110v356" stroke="#294056"/><path d="M508 110v356" stroke="#294056"/><path d="M556 110v356" stroke="#294056"/><path d="M604 110v356" stroke="#294056"/><path d="M652 110v356" stroke="#294056"/><path d="M700 110v356" stroke="#294056"/><path d="M748 110v356" stroke="#294056"/><path d="M30 144h740" stroke="#294056"/><path d="M30 192h740" stroke="#294056"/><path d="M30 240h740" stroke="#294056"/><path d="M30 288h740" stroke="#294056"/><path d="M30 336h740" stroke="#294056"/><path d="M30 384h740" stroke="#294056"/><path d="M30 432h740" stroke="#294056"/><path d="M400 108v360" stroke="#edf5ff" stroke-width="2"/><text x="42" y="134" font-size="16" fill="#49d8ee" text-anchor="start">P1</text><text x="414" y="134" font-size="16" fill="#ffb25e" text-anchor="start">P2</text><rect x="198" y="272" width="32" height="32" rx="3" fill="#49d8ee" stroke="none" stroke-width="2"/><rect x="570" y="272" width="32" height="32" rx="3" fill="#ffb25e" stroke="none" stroke-width="2"/><rect x="364" y="236" width="18" height="40" rx="0" fill="#7ce3ab" stroke="none" stroke-width="2"/><rect x="414" y="236" width="18" height="40" rx="0" fill="#7ce3ab" stroke="none" stroke-width="2"/><text x="28" y="510" font-size="22" fill="#edf5ff" text-anchor="start">Cyan and orange occupy different world positions.</text><text x="28" y="548" font-size="22" fill="#edf5ff" text-anchor="start">Each camera centers on its own player.</text><text x="28" y="596" font-size="19" fill="#a4bad0" text-anchor="start">The grid and mint beacon are shared scene content.</text><text x="28" y="682" font-size="17" fill="#a4bad0" text-anchor="start">Schematic preview · no assets or hardware required</text></g></svg>
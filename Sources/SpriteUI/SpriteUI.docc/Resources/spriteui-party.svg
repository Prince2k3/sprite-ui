<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="An original campaign remains separate from a party lobby with two prepared worlds and a host-committed handoff."><rect width="1000" height="440" rx="24" fill="#111827"/><g font-family="system-ui,sans-serif" fill="#f3f4f6"><text x="42" y="58" font-size="28" font-weight="700">Prepare together. Play after the host commits.</text><g fill="#1f2937" stroke="#22d3ee" stroke-width="2"><rect x="42" y="100" width="260" height="230" rx="16"/><rect x="350" y="100" width="280" height="230" rx="16"/><rect x="680" y="100" width="278" height="230" rx="16"/></g><text x="62" y="143" font-size="21">Original campaign</text><text x="62" y="190" font-size="18">7 coins stay here</text><text x="62" y="230" font-size="18">No automatic swap</text><text x="370" y="143" font-size="21">Fixed party lobby</text><text x="370" y="190" font-size="18">Alice: arena-v1 · ready</text><text x="370" y="230" font-size="18">Bob: arena-v1 · ready</text><text x="370" y="282" font-size="18" fill="#67e8f9">Host requests handoff</text><text x="700" y="143" font-size="21">Prepared worlds</text><text x="700" y="190" font-size="18">Attach and acknowledge</text><text x="700" y="230" font-size="18">Host commits play</text><text x="700" y="282" font-size="18" fill="#67e8f9">Host actor → client replica</text><text x="42" y="390" font-size="19">Account-free practice · matching level versions · explicit readiness · fixed roster</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Fixed ticks, interpolation, and buffered input</title>
  <desc id="desc">Input transitions are consumed by fixed custom systems, whose canonical poses feed independent display-frame interpolation. Native physics remains separate.</desc>
  <rect width="1000" height="620" rx="24" fill="#111c30"/>
  <text x="40" y="52" font-family="system-ui,sans-serif" font-size="28" fill="#e0ebf4" text-anchor="start">Fixed simulation and interpolated presentation</text><text x="40" y="91" font-family="system-ui,sans-serif" font-size="20" fill="#93adc5" text-anchor="start">Custom game rules and display cadence have separate clocks.</text><rect x="40" y="130" width="270" height="150" rx="12" fill="#182b43" stroke="#45607a"/><text x="65" y="169" font-family="system-ui,sans-serif" font-size="21" fill="#e0ebf4" text-anchor="start">Caller-owned input buffer</text><text x="65" y="208" font-family="system-ui,sans-serif" font-size="21" fill="#7ce3ab" text-anchor="start">press → release</text><text x="65" y="247" font-family="system-ui,sans-serif" font-size="19" fill="#93adc5" text-anchor="start">consume once per tick</text><rect x="365" y="130" width="270" height="150" rx="12" fill="#182b43" stroke="#45607a"/><text x="390" y="169" font-family="system-ui,sans-serif" font-size="21" fill="#e0ebf4" text-anchor="start">Fixed custom systems</text><text x="390" y="208" font-family="system-ui,sans-serif" font-size="21" fill="#48d9ec" text-anchor="start">20 Hz in this tutorial</text><text x="390" y="247" font-family="system-ui,sans-serif" font-size="19" fill="#93adc5" text-anchor="start">canonical transforms</text><rect x="690" y="130" width="270" height="150" rx="12" fill="#182b43" stroke="#45607a"/><text x="715" y="169" font-family="system-ui,sans-serif" font-size="21" fill="#e0ebf4" text-anchor="start">Display presentation</text><text x="715" y="208" font-family="system-ui,sans-serif" font-size="21" fill="#48d9ec" text-anchor="start">30 / 60 / 120 FPS</text><text x="715" y="247" font-family="system-ui,sans-serif" font-size="19" fill="#93adc5" text-anchor="start">one fixed tick behind</text><path d="M315 205h44m-8-6 8 6-8 6M640 205h44m-8-6 8 6-8 6" fill="none" stroke="#7ce3ab" stroke-width="3"/><text x="40" y="333" font-family="system-ui,sans-serif" font-size="19" fill="#ffb45b" text-anchor="start">Fixed ticks</text><path d="M210 328H940" stroke="#45607a" stroke-width="2"/><path d="M230 315v26" stroke="#ffb45b" stroke-width="4"/><path d="M330 315v26" stroke="#ffb45b" stroke-width="4"/><path d="M430 315v26" stroke="#ffb45b" stroke-width="4"/><path d="M530 315v26" stroke="#ffb45b" stroke-width="4"/><path d="M630 315v26" stroke="#ffb45b" stroke-width="4"/><path d="M730 315v26" stroke="#ffb45b" stroke-width="4"/><path d="M830 315v26" stroke="#ffb45b" stroke-width="4"/><path d="M930 315v26" stroke="#ffb45b" stroke-width="4"/><text x="40" y="396" font-family="system-ui,sans-serif" font-size="19" fill="#48d9ec" text-anchor="start">Display frames</text><path d="M210 391H940" stroke="#45607a" stroke-width="2"/><path d="M230 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M263 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M296 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M329 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M362 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M395 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M428 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M461 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M494 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M527 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M560 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M593 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M626 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M659 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M692 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M725 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M758 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M791 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M824 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M857 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M890 382v18" stroke="#48d9ec" stroke-width="2"/><path d="M923 382v18" stroke="#48d9ec" stroke-width="2"/><text x="40" y="466" font-family="system-ui,sans-serif" font-size="20" fill="#e0ebf4" text-anchor="start">Interpolation changes displayed poses; model queries and snapshots stay canonical.</text><text x="40" y="511" font-family="system-ui,sans-serif" font-size="20" fill="#93adc5" text-anchor="start">Bound catch-up · preserve fractional remainder · reset debt on suspension</text><text x="40" y="556" font-family="system-ui,sans-serif" font-size="19" fill="#93adc5" text-anchor="start">Native SpriteKit physics and actions retain the existing display-frame lifecycle.</text>
</svg>

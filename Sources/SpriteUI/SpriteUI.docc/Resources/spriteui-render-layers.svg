<svg xmlns="http://www.w3.org/2000/svg" width="804" height="680" viewBox="0 0 804 680" role="img" aria-labelledby="title desc"><title id="title">Render layers and camera visibility</title><desc id="desc">A world square and map diamond share a physical parent; camera and pane masks choose artwork without pausing physics.</desc><rect width="804" height="680" rx="24" fill="#101b2b"/><g font-family="system-ui,sans-serif"><text x="24" y="48" font-size="32" fill="#edf5ff">One world, two looks</text><text x="24" y="90" font-size="22" fill="#a4bad0">Separate artwork. Shared motion. Interactive cameras.</text><rect x="24" y="128" width="756" height="300" rx="12" fill="#172a40" stroke="#52677e" stroke-width="2"/><text x="54" y="169" font-size="22" fill="#49d8ee">WORLD · default layer</text><text x="434" y="169" font-size="22" fill="#7ce3ab">MAP · custom layer</text><path d="M402 128v300" stroke="#52677e" stroke-width="2"/><rect x="175" y="251" width="56" height="56" rx="3" fill="#49d8ee" stroke="none" stroke-width="2"/><path d="M584 266l13 13-13 13-13-13z" fill="#7ce3ab"/><text x="24" y="480" font-size="26" fill="#edf5ff">Physical parent</text><text x="24" y="520" font-size="22" fill="#a4bad0">Neutral, or explicitly allows both layers</text><text x="24" y="580" font-size="24" fill="#edf5ff">Camera mask ∩ pane restriction = visible layers</text><text x="24" y="632" font-size="22" fill="#a4bad0">Hide visuals while bounces and time continue.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
<title id="title">Stage 2 · save and pass typed state</title>
<desc id="desc">Schematic result after A saves twice, passes, and B reloads</desc>
<rect width="1040" height="480" rx="24" fill="#101b2c"/>
<text x="44" y="64" fill="#f3f7ff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Stage 2 · save and pass typed state</text>
<text x="44" y="101" fill="#b8cadf" font-family="system-ui,sans-serif" font-size="18" font-weight="400">Schematic result after A saves twice, passes, and B reloads</text>
<rect x="44" y="145" width="440" height="220" rx="18" fill="#192b42" stroke="#ffb663" stroke-width="2"/>
<text x="68" y="188" fill="#ffb663" font-family="system-ui,sans-serif" font-size="23" font-weight="600">Player A · waiting</text>
<text x="68" y="230" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18" font-weight="400">Saved total: 2</text>
<text x="68" y="264" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18" font-weight="400">Save kept A’s turn until Pass</text>
<text x="68" y="298" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18" font-weight="400">Write controls disabled after Pass</text>
<rect x="556" y="145" width="440" height="220" rx="18" fill="#192b42" stroke="#63d7f5" stroke-width="2"/>
<text x="580" y="188" fill="#63d7f5" font-family="system-ui,sans-serif" font-size="23" font-weight="600">Player B · can act</text>
<text x="580" y="230" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18" font-weight="400">Reloaded total: 2</text>
<text x="580" y="264" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18" font-weight="400">State schema version: 1</text>
<text x="580" y="298" fill="#e5eefc" font-family="system-ui,sans-serif" font-size="18" font-weight="400">Save / Pass / Finish tied enabled</text>
<text x="44" y="420" fill="#b8cadf" font-family="system-ui,sans-serif" font-size="18" font-weight="400">One explicit shared in-memory store · Reload per identity · No world snapshot or lockstep</text>
</svg>

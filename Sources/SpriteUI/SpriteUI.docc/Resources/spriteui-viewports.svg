<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
<title id="title">One world through three cameras</title><desc id="desc">One simulation feeds two independent player camera views and a third, noninteractive minimap.</desc>
<rect width="800" height="720" rx="24" fill="#101b2b"/>
<g font-family="system-ui,sans-serif" fill="#edf5ff"><text x="30" y="44" font-size="30" fill="#edf5ff" text-anchor="start">One world · independent viewports</text><rect x="30" y="76" width="350" height="264" rx="12" fill="#172b42" stroke="#49d8ee" stroke-width="2"/><rect x="420" y="76" width="350" height="264" rx="12" fill="#172b42" stroke="#ffb25e" stroke-width="2"/><text x="48" y="105" font-size="19" fill="#49d8ee" text-anchor="start">P1 camera</text><text x="438" y="105" font-size="19" fill="#ffb25e" text-anchor="start">P2 camera</text><rect x="189" y="194" width="32" height="32" rx="3" fill="#49d8ee" stroke="none" stroke-width="2"/><text x="205" y="182" font-size="15" fill="#edf5ff" text-anchor="middle">P1</text><rect x="579" y="194" width="32" height="32" rx="3" fill="#ffb25e" stroke="none" stroke-width="2"/><text x="595" y="182" font-size="15" fill="#edf5ff" text-anchor="middle">P2</text><rect x="613" y="92" width="138" height="80" rx="4" fill="#0b1722" stroke="#edf5ff" stroke-width="2"/><text x="624" y="114" font-size="13" fill="#edf5ff" text-anchor="start">MAP · view only</text><rect x="646" y="135" width="12" height="12" rx="0" fill="#49d8ee" stroke="none" stroke-width="2"/><rect x="708" y="135" width="12" height="12" rx="0" fill="#ffb25e" stroke="none" stroke-width="2"/><rect x="190" y="447" width="420" height="135" rx="14" fill="#1c3545" stroke="#7ce3ab" stroke-width="2"/><text x="400" y="479" font-size="23" fill="#7ce3ab" text-anchor="middle">ONE SHARED WORLD</text><text x="400" y="517" font-size="19" fill="#edf5ff" text-anchor="middle">Entities · physics · actions · audio</text><text x="400" y="551" font-size="19" fill="#edf5ff" text-anchor="middle">One update per display tick</text><path d="M275 447V369h-70v-24m-7 10 7-10 7 10M525 447V369h70v-24m-7 10 7-10 7 10" fill="none" stroke="#a4bad0" stroke-width="3"/><text x="400" y="641" font-size="20" fill="#edf5ff" text-anchor="middle">Player sessions own input; viewports own presentation.</text><text x="400" y="682" font-size="18" fill="#a4bad0" text-anchor="middle">Three cameras render the same native scene.</text></g></svg>
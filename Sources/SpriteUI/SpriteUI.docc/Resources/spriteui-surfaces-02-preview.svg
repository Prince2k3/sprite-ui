<rect x="36" y="120" width="728" height="280" fill="#111c30" stroke="#66819a"/><rect x="48" y="132" width="336" height="256" fill="#132c38" stroke="#6ee7b7" stroke-width="2"/><rect x="416" y="132" width="336" height="256" fill="#182b43" stroke="#6ee7b7" stroke-width="2"/><rect x="390" y="120" width="20" height="280" fill="#9d4153"/><text x="60" y="158" fill="#6ee7b7" font-size="18">Usable 0</text><text x="428" y="158" fill="#6ee7b7" font-size="18">Usable 1</text><rect x="200" y="244" width="32" height="32" fill="#49d8ee"/><rect x="568" y="244" width="32" height="32" fill="#ffb25e"/>

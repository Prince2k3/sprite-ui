<svg xmlns="http://www.w3.org/2000/svg" width="2620" height="400" viewBox="0 0 2620 400" role="img" aria-labelledby="title desc">
  <title id="title">Build an interactive SpriteUI scene</title>
  <desc id="desc">Eleven connected panels progress from a cyan sprite, through targeted motion and a route around a wall, to a directional pad feeding shared input actions, then direct manipulation on a tilted grid and two independent players with owned devices, shared-world viewports, world/map render layers, a repeating parallax landscape, level transitions with persistent players, and adaptive game surfaces.</desc>

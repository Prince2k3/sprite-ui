<svg xmlns="http://www.w3.org/2000/svg" width="804" height="1230" viewBox="0 0 804 1230" role="img" aria-labelledby="title desc"><title id="title">3. Select art and narrow the map</title><desc id="desc">Stage 3 expected result for the render layers tutorial. World squares and map diamonds occupy matching positions.</desc><rect width="804" height="1230" rx="24" fill="#101b2b"/><g font-family="system-ui,sans-serif"><text x="24" y="42" font-size="28" fill="#edf5ff">3. Select art and narrow the map</text><text x="24" y="80" font-size="18" fill="#a4bad0">Expected result · schematic, not a captured frame</text><rect x="24" y="110" width="756" height="560" rx="8" fill="#070e18" stroke="#52677e" stroke-width="2"/><path d="M402 110v560" stroke="#52677e" stroke-width="2"/><text x="36" y="138" font-size="18" fill="#49d8ee">WORLD</text><text x="416" y="138" font-size="18" fill="#7ce3ab">MAP · TAP TO SELECT</text><rect x="82" y="180" width="260" height="420" rx="0" fill="none" stroke="#63788d" stroke-width="2"/><rect x="460" y="180" width="260" height="420" rx="0" fill="none" stroke="#63788d" stroke-width="2"/><rect x="124" y="452" width="56" height="56" rx="2" fill="#49d8ee" stroke="none" stroke-width="2"/><rect x="244" y="272" width="56" height="56" rx="2" fill="#ffb25e" stroke="none" stroke-width="2"/><path d="M530 467l13 13-13 13-13-13z" fill="#7ce3ab"/><path d="M650 287l13 13-13 13-13-13z" fill="#ffe077"/><rect x="103" y="519" width="98" height="35" rx="17" fill="#ffe077" stroke="none" stroke-width="2"/><text x="116" y="544" font-size="21" fill="#101b2b">Comet</text><rect x="610" y="340" width="80" height="35" rx="17" fill="#ffe077" stroke="none" stroke-width="2"/><text x="628" y="365" font-size="21" fill="#101b2b">Kite</text><text x="24" y="712" font-size="23" fill="#edf5ff">Bounces · Time · One world · Updates · Travel</text><rect x="24" y="748" width="756" height="58" rx="8" fill="#172a40" stroke="none" stroke-width="2"/><text x="40" y="785" font-size="25" fill="#edf5ff">Hide world squares</text><rect x="682" y="761" width="74" height="34" rx="17" fill="#52677e" stroke="none" stroke-width="2"/><rect x="686" y="764" width="28" height="28" rx="14" fill="#edf5ff" stroke="none" stroke-width="2"/><rect x="24" y="814" width="756" height="58" rx="8" fill="#172a40" stroke="none" stroke-width="2"/><text x="40" y="851" font-size="25" fill="#edf5ff">Hide both objects</text><rect x="682" y="827" width="74" height="34" rx="17" fill="#52677e" stroke="none" stroke-width="2"/><rect x="686" y="830" width="28" height="28" rx="14" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="24" y="914" font-size="25" fill="#edf5ff">Map camera shows</text><rect x="24" y="936" width="756" height="60" rx="10" fill="#172a40" stroke="none" stroke-width="2"/><rect x="28" y="940" width="246" height="52" rx="8" fill="#42637e" stroke="none" stroke-width="2"/><text x="66" y="975" font-size="24" fill="#edf5ff">Map only</text><text x="342" y="975" font-size="24" fill="#edf5ff">Both</text><text x="572" y="975" font-size="24" fill="#edf5ff">Nothing</text><text x="24" y="1044" font-size="25" fill="#edf5ff">Limit map pane to world squares</text><rect x="682" y="1016" width="74" height="34" rx="17" fill="#52677e" stroke="none" stroke-width="2"/><rect x="686" y="1019" width="28" height="28" rx="14" fill="#edf5ff" stroke="none" stroke-width="2"/><text x="24" y="1100" font-size="24" fill="#a4bad0">Map only + limit → empty pane</text><text x="24" y="1140" font-size="24" fill="#a4bad0">Both + limit → world art only</text><text x="24" y="1190" font-size="22" fill="#edf5ff">Labels follow the selected art’s visibility.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">Two robots, one repair crew</title><rect width="1200" height="520" rx="26" fill="#0b1421"/><g font-family="system-ui, sans-serif"><text x="60" y="75" fill="#f5f8ff" font-size="34" font-weight="700">Two robots. One repair crew.</text><rect x="60" y="140" width="430" height="220" rx="22" fill="#123a32"/><text x="90" y="185" fill="#72e8c0" font-size="26">AUTHORITATIVE HOST</text><text x="90" y="235" fill="#edf5fb" font-size="20">Four bots • time • shared score</text><text x="90" y="280" fill="#a9bbce" font-size="19">Validate beams and apply cures once</text><text x="90" y="320" fill="#a9bbce" font-size="19">Approved checkpoint for recovery</text><path d="M510 230 H680 M680 280 H510" stroke="#9aaabc" stroke-width="3"/><rect x="700" y="140" width="440" height="220" rx="22" fill="#103442"/><text x="730" y="185" fill="#53d8f4" font-size="26">INDEPENDENT CLIENT</text><text x="730" y="235" fill="#edf5fb" font-size="20">Predict movement • send beam intent</text><text x="730" y="280" fill="#a9bbce" font-size="19">Present selected validated state</text><text x="730" y="320" fill="#a9bbce" font-size="19">Fresh baseline before resumed input</text><text x="60" y="440" fill="#a9bbce" font-size="21">Touch, keyboard, and gamepad share one input session.</text><text x="60" y="480" fill="#a9bbce" font-size="21">Local preview uses real SDK handoff; signed Game Center validation stays separate.</text></g></svg>
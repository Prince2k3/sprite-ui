<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">02 Parent-local rail and snapping</title><desc id="desc">Expected result diagram: A mint child follows a tilted X rail within local bounds in grid steps.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#e1f1f8}.small{font-size:14px}.muted{fill:#9db9cb}</style>
<rect width="720" height="520" rx="24" fill="#102230"/>
<text x="32" y="42" font-size="22" font-weight="700">02  Parent-local rail and snapping</text>
<rect x="32" y="64" width="656" height="302" rx="12" fill="#07131f" stroke="#38566b"/>
<rect x="165" y="98" width="48" height="32" rx="3" fill="#21d6f1"/>
<g transform="translate(360 202) rotate(-30) scale(1.1)">
<rect x="-110" y="-30" width="220" height="60" fill="#123732" stroke="#74dfb5"/>
<path d="M-80-30v60m20-60v60m20-60v60m20-60v60m20-60v60m20-60v60m20-60v60m20-60v60m20-60v60" stroke="#377966"/>
<path d="M-80 0H80" stroke="#74dfb5" stroke-width="2"/>
<rect x="26" y="-14" width="28" height="28" rx="3" fill="#74dfb5"/>
<path d="M-65 0h65m-8-6 8 6-8 6" fill="none" stroke="#e1f1f8" stroke-width="2"/>
</g>
<text x="360" y="330" text-anchor="middle" class="small muted">Local X: -80…80 · local Y locked · grid: 20 · angle: 15°</text>
<text x="360" y="405" text-anchor="middle" class="small">Parent: rotation 30° · scale 1.1</text>
<text x="360" y="436" text-anchor="middle" class="small muted">Bounds constrain the child origin in its parent’s coordinates</text>
<text x="360" y="503" text-anchor="middle" font-size="12" class="muted">Expected result illustration</text></svg>

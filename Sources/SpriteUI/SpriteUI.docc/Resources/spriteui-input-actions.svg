<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">One action model, many controls</title><desc id="desc">Virtual controls and optional keyboard, pointer, and extended or micro gamepad input feed Move and Fire. A system reads Move to position a cyan player.</desc><style>text{font-family:system-ui,sans-serif;fill:#e1f1f8}.small{font-size:14px}.label{font-size:18px;font-weight:600}.muted{fill:#9db9cb}</style>

<rect x="0" y="0" width="720" height="480" rx="12" fill="#102230" stroke="#102230"/><text x="36" y="48" font-size="24" fill="#e1f1f8" text-anchor="start">03  Adapt prompts and feedback</text><rect x="36" y="85" width="310" height="218" rx="12" fill="#172e40" stroke="#38566b"/><rect x="56" y="112" width="44" height="44" rx="12" fill="#48d9ec" stroke="#48d9ec"/><text x="56" y="195" font-size="20" fill="#48d9ec" text-anchor="start">Pad A → P1</text><text x="56" y="232" font-size="16" fill="#e1f1f8" text-anchor="start">Last meaningful: Pad A</text><rect x="374" y="85" width="310" height="218" rx="12" fill="#172e40" stroke="#38566b"/><rect x="394" y="112" width="44" height="44" rx="12" fill="#ffb45b" stroke="#ffb45b"/><text x="394" y="195" font-size="20" fill="#ffb45b" text-anchor="start">Pad B → P2</text><text x="394" y="232" font-size="16" fill="#e1f1f8" text-anchor="start">Last meaningful: None yet</text><rect x="36" y="332" width="648" height="106" rx="12" fill="#07131f" stroke="#38566b"/><text x="360" y="372" font-size="18" fill="#e1f1f8" text-anchor="middle">Prompt: Fire on Pad A · Feedback: unsupported</text><text x="360" y="407" font-size="17" fill="#9db9cb" text-anchor="middle">Optional controllers start unassigned</text><text x="360" y="461" font-size="12" fill="#9db9cb" text-anchor="middle">Expected result illustration</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Fixed kinematic motion</title>
  <desc id="desc">Kinematic fixed-step tutorial preview. Illustrative positions; live counters depend on elapsed time.</desc>
  <rect width="1000" height="620" rx="24" fill="#111c30"/>
  <text x="40" y="52" font-family="system-ui,sans-serif" font-size="28" fill="#e0ebf4" text-anchor="start">1. Fixed kinematic motion</text><text x="40" y="88" font-family="system-ui,sans-serif" font-size="18" fill="#93adc5" text-anchor="start">Schematic expected result · 20 Hz custom simulation</text><rect x="40" y="164" width="920" height="260" rx="12" fill="#0c142b" stroke="#45607a"/><path d="M180 290H870" stroke="#45607a" stroke-width="2"/><path d="M200 284v12" stroke="#45607a" stroke-width="2"/><path d="M265 284v12" stroke="#45607a" stroke-width="2"/><path d="M330 284v12" stroke="#45607a" stroke-width="2"/><path d="M395 284v12" stroke="#45607a" stroke-width="2"/><path d="M460 284v12" stroke="#45607a" stroke-width="2"/><path d="M525 284v12" stroke="#45607a" stroke-width="2"/><path d="M590 284v12" stroke="#45607a" stroke-width="2"/><path d="M655 284v12" stroke="#45607a" stroke-width="2"/><path d="M720 284v12" stroke="#45607a" stroke-width="2"/><path d="M785 284v12" stroke="#45607a" stroke-width="2"/><rect x="530" y="272" width="36" height="36" rx="4" fill="#48d9ec" stroke="#48d9ec"/><text x="65" y="256" font-family="system-ui,sans-serif" font-size="18" fill="#48d9ec" text-anchor="start">Fixed actor</text><text x="40" y="468" font-family="system-ui,sans-serif" font-size="22" fill="#e0ebf4" text-anchor="start">One update per fixed tick · deltaTime = 0.05 seconds</text><text x="40" y="507" font-family="system-ui,sans-serif" font-size="19" fill="#93adc5" text-anchor="start">Custom component motion with no native physics or actions.</text><text x="40" y="546" font-family="system-ui,sans-serif" font-size="19" fill="#93adc5" text-anchor="start">One display frame can execute zero, one, or several ticks.</text>
</svg>

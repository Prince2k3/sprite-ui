<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="An approved host checkpoint survives interruption; a fresh same-roster match waits for validated client baselines before resuming."><rect width="1000" height="460" rx="24" fill="#111827"/><g font-family="system-ui,sans-serif" fill="#f3f4f6"><text x="40" y="60" font-size="28" font-weight="700">Save deliberately. Rejoin explicitly. Resume together.</text><g fill="#1f2937" stroke="#34d399" stroke-width="2"><rect x="40" y="105" width="275" height="230" rx="16"/><rect x="360" y="105" width="275" height="230" rx="16"/><rect x="680" y="105" width="280" height="230" rx="16"/></g><text x="60" y="149" font-size="21">Approved checkpoint</text><text x="60" y="194" font-size="18">Round progress 3</text><text x="60" y="234" font-size="18">Exact ID + digest + scope</text><text x="60" y="286" font-size="17" fill="#6ee7b7">Application-owned file</text><text x="380" y="149" font-size="21">Fresh party match</text><text x="380" y="194" font-size="18">Original host and roster</text><text x="380" y="234" font-size="18">Explicit checkpoint acceptance</text><text x="380" y="286" font-size="17" fill="#6ee7b7">No automatic retry</text><text x="700" y="149" font-size="21">Resynchronize</text><text x="700" y="194" font-size="18">Apply new host baseline</text><text x="700" y="234" font-size="18">All clients acknowledge</text><text x="700" y="286" font-size="17" fill="#6ee7b7">Then return to Playing</text><text x="40" y="395" font-size="19">Interrupted connection ≠ lost checkpoint · no automatic host migration or reward replay</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Stage 3 · Place and release controls</title><desc id="desc">A full HUD fits or is hidden. Layout changes release the virtual pad. Schematic illustration, not a runtime capture.</desc>
<rect width="800" height="600" rx="24" fill="#0c1425"/>
<g font-family="system-ui, sans-serif"><text x="28" y="48" font-size="28" fill="#edf5ff">Stage 3 · Place and release controls</text>
<text x="28" y="82" font-size="17" fill="#a4bad0">A full HUD fits or is hidden. Layout changes release the virtual pad.</text>
<rect x="36" y="120" width="728" height="280" fill="#111c30" stroke="#66819a"/><rect x="48" y="132" width="336" height="256" fill="#132c38" stroke="#6ee7b7" stroke-width="2"/><rect x="416" y="132" width="336" height="256" fill="#182b43" stroke="#6ee7b7" stroke-width="2"/><rect x="390" y="120" width="20" height="280" fill="#9d4153"/><text x="60" y="158" fill="#6ee7b7" font-size="18">Usable 0</text><text x="428" y="158" fill="#6ee7b7" font-size="18">Usable 1</text><rect x="200" y="244" width="32" height="32" fill="#49d8ee"/><rect x="568" y="244" width="32" height="32" fill="#ffb25e"/><rect x="584" y="332" width="156" height="44" rx="8" fill="#32778a"/><text x="662" y="360" text-anchor="middle" fill="#ffffff" font-size="17">Move P1 right</text><rect x="154" y="199" width="124" height="30" rx="4" fill="#050b12"/><text x="216" y="220" text-anchor="middle" fill="#edf5ff" font-size="16">P1 · 2 regions</text><rect x="36" y="430" width="120" height="44" rx="8" fill="#203d54"/><text x="96" y="458" text-anchor="middle" fill="#edf5ff" font-size="18">Stop P1</text>
<text x="28" y="520" font-size="19" fill="#a4bad0">Scale-only and inactive metadata changes keep held input</text>
<text x="28" y="570" font-size="16" fill="#a4bad0">Schematic preview · bounds and insets depend on the actual host</text></g></svg>

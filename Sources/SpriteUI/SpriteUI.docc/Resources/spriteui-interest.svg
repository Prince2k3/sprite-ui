<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">Independent scopes and replication credits</title><rect width="1200" height="520" rx="26" fill="#0b1421"/><g font-family="system-ui, sans-serif"><text x="60" y="75" fill="#f5f8ff" font-size="34" font-weight="700">Send what each player needs.</text><rect x="60" y="135" width="330" height="235" rx="22" fill="#123a32"/><text x="90" y="180" fill="#72e8c0" font-size="26">HOST WORLD</text><text x="90" y="230" fill="#edf5fb" font-size="20">Canonical game state</text><text x="90" y="275" fill="#a9bbce" font-size="19">Owned actors + ancestors</text><text x="90" y="315" fill="#a9bbce" font-size="19">Distance + group policy</text><path d="M410 220 H630 M520 220 V330 H630" fill="none" stroke="#9aaabc" stroke-width="3"/><rect x="650" y="135" width="480" height="120" rx="20" fill="#103442"/><text x="680" y="180" fill="#53d8f4" font-size="25">ALICE: left scope</text><text x="680" y="220" fill="#edf5fb" font-size="19">Reliable membership • independent credits</text><rect x="650" y="285" width="480" height="120" rx="20" fill="#3a2b1d"/><text x="680" y="330" fill="#ffb65d" font-size="25">BOB: right scope</text><text x="680" y="370" fill="#edf5fb" font-size="19">Prioritized poses • periodic loss repair</text><text x="60" y="465" fill="#a9bbce" font-size="21">Entity budgets include envelopes; application and control traffic remain separate.</text></g></svg>